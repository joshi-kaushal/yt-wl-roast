services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-wl-roast-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - default
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
